name: modal-experiment

# Runs the question-order experiment on a Modal GPU and commits the result
# files back to the branch. Pushes to experiments/** on the working branch
# start it; it can also be started by hand from the Actions tab.

on:
  push:
    branches: [claude/check-this-out-yubis2]
    paths:
      - "experiments/**"
      - ".github/workflows/modal-experiment.yml"
  workflow_dispatch:
    inputs:
      prompts:
        description: "Comma-separated layouts: last_nobos, last, first"
        default: "last_nobos,last,first"

permissions:
  contents: write

concurrency:
  group: modal-experiment
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PROMPTS: ${{ github.event.inputs.prompts || 'last_nobos,last,first' }}
    steps:
      - uses: actions/checkout@v4

      - name: Which secrets are set (names only, never values)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          MODAL_TOKEN: ${{ secrets.MODAL_TOKEN }}
        run: |
          for name in MODAL_TOKEN_ID MODAL_TOKEN_SECRET MODAL_TOKEN HF_TOKEN KAGGLE_USERNAME KAGGLE_KEY KAGGLE_API_TOKEN; do
            if [ -n "${!name}" ]; then echo "$name: set"; else echo "$name: missing"; fi
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet modal pytest numpy

      - name: Tests
        run: python -m pytest -q

      - name: Run on Modal
        if: env.MODAL_TOKEN_ID != '' && env.MODAL_TOKEN_SECRET != ''
        run: modal run experiments/modal_app.py --prompts "$PROMPTS"

      - name: Commit results
        if: env.MODAL_TOKEN_ID != '' && env.MODAL_TOKEN_SECRET != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/experiments
          if git diff --cached --quiet; then echo "no result files"; exit 0; fi
          git commit -m "Add question-order experiment results from run ${{ github.run_id }}."
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
