name: tests

# Runs the test suite on every push to the working branch. The experiment
# itself runs as a Kaggle kernel (experiments/make_kaggle_kernel.py), not here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet pytest numpy
      - name: Tests
        run: python -m pytest -q
